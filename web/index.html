<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyMarkdown</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- CodeMirror 5 -->
  <link rel="stylesheet" href="lib/codemirror/codemirror.min.css">
  <link rel="stylesheet" href="lib/codemirror/addon/dialog/dialog.min.css">

  <!-- Highlight.js -->
  <link rel="stylesheet" href="lib/highlightjs/github.min.css" id="hljs-light">
  <link rel="stylesheet" href="lib/highlightjs/github-dark.min.css" id="hljs-dark" disabled>

  <!-- KaTeX -->
  <link rel="stylesheet" href="lib/katex/katex.min.css">

  <!-- App Styles -->
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/preview.css">
  <link rel="stylesheet" href="css/toolbar.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/statusbar.css">
  <link rel="stylesheet" href="css/folder-tree.css">
  <link rel="stylesheet" href="css/help.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body class="theme-light">
  <!-- Menu Bar -->
  <header class="menu-bar" id="menuBar">
    <div class="menu-bar-left">
      <div class="menu-item" data-menu="file">
        <span class="menu-label" data-i18n="menu.file">File</span>
        <div class="menu-dropdown" id="menu-file">
          <button class="menu-command" data-action="new" data-i18n="menu.new">New</button>
          <button class="menu-command" data-action="open" data-i18n="menu.open">Open File</button>
          <div class="menu-separator"></div>
          <button class="menu-command" data-action="save" data-i18n="menu.save">Save</button>
          <button class="menu-command" data-action="saveAs" data-i18n="menu.saveAs">Save As</button>
          <div class="menu-separator"></div>
          <div class="menu-submenu">
            <button class="menu-command submenu-trigger" data-i18n="menu.recentFiles">Recent Files</button>
            <div class="submenu-dropdown" id="recentFilesMenu"></div>
          </div>
          <div class="menu-separator"></div>
          <button class="menu-command" data-action="exportHTML" data-i18n="menu.exportHTML">Export HTML</button>
          <button class="menu-command" data-action="exportPDF" data-i18n="menu.exportPDF">Export PDF</button>
          <div class="menu-separator"></div>
          <button class="menu-command" data-action="print" data-i18n="menu.print">Print</button>
          <div class="menu-separator"></div>
          <button class="menu-command" data-action="close" data-i18n="menu.close">Close</button>
          <button class="menu-command" data-action="closeAll" data-i18n="menu.closeAll">Close All</button>
          <div class="menu-separator"></div>
          <button class="menu-command" data-action="exit" data-i18n="menu.exit" id="menuExitBtn" style="display:none">Exit</button>
        </div>
      </div>
      <div class="menu-item" data-menu="edit">
        <span class="menu-label" data-i18n="menu.edit">Edit</span>
        <div class="menu-dropdown" id="menu-edit">
          <button class="menu-command" data-action="undo" data-i18n="menu.undo">Undo</button>
          <button class="menu-command" data-action="redo" data-i18n="menu.redo">Redo</button>
          <div class="menu-separator"></div>
          <button class="menu-command" data-action="cut" data-i18n="menu.cut">Cut</button>
          <button class="menu-command" data-action="copy" data-i18n="menu.copy">Copy</button>
          <button class="menu-command" data-action="paste" data-i18n="menu.paste">Paste</button>
          <button class="menu-command" data-action="selectAll" data-i18n="menu.selectAll">Select All</button>
          <div class="menu-separator"></div>
          <button class="menu-command" data-action="find" data-i18n="menu.find">Find</button>
          <button class="menu-command" data-action="replace" data-i18n="menu.replace">Find & Replace</button>
          <div class="menu-separator"></div>
          <button class="menu-command" data-action="togglePreview" data-i18n="menu.togglePreview">Toggle Preview</button>
        </div>
      </div>
      <div class="menu-item" data-menu="view">
        <span class="menu-label" data-i18n="menu.view">View</span>
        <div class="menu-dropdown" id="menu-view">
          <button class="menu-command" data-action="toggleLineNumbers" data-i18n="menu.toggleLineNumbers">Toggle Line Numbers</button>
          <button class="menu-command" data-action="toggleFolderTree" data-i18n="menu.toggleFolderTree">Toggle Folder Tree</button>
          <button class="menu-command" data-action="fullscreenPreview" data-i18n="menu.fullscreenPreview">Full Screen Preview</button>
          <div class="menu-separator"></div>
          <button class="menu-command" data-action="pageZoomIn" data-i18n="menu.zoomIn">Zoom In</button>
          <button class="menu-command" data-action="pageZoomOut" data-i18n="menu.zoomOut">Zoom Out</button>
          <button class="menu-command" data-action="pageZoomReset" data-i18n="menu.resetZoom">Reset Zoom</button>
          <div class="menu-separator"></div>
          <button class="menu-command" data-action="toggleTheme" data-i18n="menu.toggleTheme">Toggle Theme</button>
        </div>
      </div>
      <div class="menu-item" data-menu="help">
        <span class="menu-label" data-i18n="menu.help">Help</span>
        <div class="menu-dropdown" id="menu-help">
          <button class="menu-command" data-action="gettingStarted" data-i18n="menu.gettingStarted">Getting Started</button>
          <button class="menu-command" data-action="cheatsheet" data-i18n="menu.cheatsheet">Markdown Cheatsheet</button>
          <button class="menu-command" data-action="tools" data-i18n="menu.tools">Useful Tools</button>
          <div class="menu-separator"></div>
          <button class="menu-command" data-action="shortcuts" data-i18n="menu.shortcuts">Keyboard Shortcuts</button>
          <div class="menu-separator"></div>
          <button class="menu-command" data-action="about" data-i18n="menu.about">About</button>
        </div>
      </div>
    </div>
    <div class="menu-bar-right">
      <div class="lang-selector">
        <select id="langSelect" title="Language">
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="en-US">English</option>
          <option value="ja-JP">日本語</option>
          <option value="ko-KR">한국어</option>
          <option value="fr-FR">Français</option>
          <option value="de-DE">Deutsch</option>
          <option value="es-ES">Español</option>
          <option value="pt-BR">Português</option>
          <option value="ru-RU">Русский</option>
          <option value="ar-SA">العربية</option>
          <option value="hi-IN">हिन्दी</option>
        </select>
      </div>
      <div class="privacy-badge" data-i18n="privacy.local" title="Data stored locally only">Local Only</div>
    </div>
  </header>

  <!-- Formatting Toolbar -->
  <div class="toolbar" id="toolbar">
    <div class="toolbar-group">
      <button class="toolbar-btn" data-action="heading" title="Heading (H1-H6)" data-i18n-title="toolbar.heading">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M5 4v3h5.5v12h3V7H19V4H5z"/></svg>
      </button>
      <button class="toolbar-btn" data-action="bold" title="Bold (Ctrl+B)" data-i18n-title="toolbar.bold">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M15.6 10.79c.97-.67 1.65-1.77 1.65-2.79 0-2.26-1.75-4-4-4H7v14h7.04c2.09 0 3.71-1.7 3.71-3.79 0-1.52-.86-2.82-2.15-3.42zM10 6.5h3c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5h-3v-3zm3.5 9H10v-3h3.5c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5z"/></svg>
      </button>
      <button class="toolbar-btn" data-action="italic" title="Italic (Ctrl+I)" data-i18n-title="toolbar.italic">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M10 4v3h2.21l-3.42 8H6v3h8v-3h-2.21l3.42-8H18V4h-8z"/></svg>
      </button>
      <button class="toolbar-btn" data-action="strikethrough" title="Strikethrough" data-i18n-title="toolbar.strikethrough">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M10 19h4v-3h-4v3zM5 4v3h5v3h4V7h5V4H5zM3 14h18v-2H3v2z"/></svg>
      </button>
      <button class="toolbar-btn" data-action="formatPainter" title="Format Painter" data-i18n-title="toolbar.formatPainter">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M18 4V3c0-.55-.45-1-1-1H5c-.55 0-1 .45-1 1v4c0 .55.45 1 1 1h12c.55 0 1-.45 1-1V6h1v4H9v11c0 .55.45 1 1 1h2c.55 0 1-.45 1-1v-9h8V4h-3z"/></svg>
      </button>
    </div>
    <div class="toolbar-separator"></div>
    <div class="toolbar-group">
      <button class="toolbar-btn" data-action="unorderedList" title="Unordered List" data-i18n-title="toolbar.unorderedList">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4 10.5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5-.67-1.5-1.5-1.5zm0-6c-.83 0-1.5.67-1.5 1.5S3.17 7.5 4 7.5 5.5 6.83 5.5 6 4.83 4.5 4 4.5zm0 12c-.83 0-1.5.68-1.5 1.5s.68 1.5 1.5 1.5 1.5-.68 1.5-1.5-.67-1.5-1.5-1.5zM7 19h14v-2H7v2zm0-6h14v-2H7v2zm0-8v2h14V5H7z"/></svg>
      </button>
      <button class="toolbar-btn" data-action="orderedList" title="Ordered List" data-i18n-title="toolbar.orderedList">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M2 17h2v.5H3v1h1v.5H2v1h3v-4H2v1zm1-9h1V4H2v1h1v3zm-1 3h1.8L2 13.1v.9h3v-1H3.2L5 10.9V10H2v1zm5-6v2h14V5H7zm0 14h14v-2H7v2zm0-6h14v-2H7v2z"/></svg>
      </button>
      <button class="toolbar-btn" data-action="taskList" title="Task List" data-i18n-title="toolbar.taskList">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM17.99 9l-1.41-1.42-6.59 6.59-2.58-2.57-1.42 1.41 4 3.99z"/></svg>
      </button>
    </div>
    <div class="toolbar-separator"></div>
    <div class="toolbar-group">
      <button class="toolbar-btn" data-action="code" title="Inline Code" data-i18n-title="toolbar.code">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
      </button>
      <button class="toolbar-btn" data-action="codeBlock" title="Code Block" data-i18n-title="toolbar.codeBlock">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12zM6 10h2v2H6v-2zm0 4h8v2H6v-2zm10 0h2v2h-2v-2zm-6-4h8v2h-8v-2z"/></svg>
      </button>
      <button class="toolbar-btn" data-action="blockquote" title="Blockquote" data-i18n-title="toolbar.blockquote">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M6 17h3l2-4V7H5v6h3zm8 0h3l2-4V7h-6v6h3z"/></svg>
      </button>
    </div>
    <div class="toolbar-separator"></div>
    <div class="toolbar-group">
      <button class="toolbar-btn" data-action="link" title="Link (Ctrl+K)" data-i18n-title="toolbar.link">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
      </button>
      <button class="toolbar-btn" data-action="image" title="Image" data-i18n-title="toolbar.image">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
      </button>
      <button class="toolbar-btn" data-action="table" title="Table" data-i18n-title="toolbar.table">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 3v18h18V3H3zm8 16H5v-6h6v6zm0-8H5V5h6v6zm8 8h-6v-6h6v6zm0-8h-6V5h6v6z"/></svg>
      </button>
      <button class="toolbar-btn" data-action="horizontalRule" title="Horizontal Rule" data-i18n-title="toolbar.horizontalRule">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M2 11h20v2H2z"/></svg>
      </button>
    </div>
    <div class="toolbar-separator"></div>
    <div class="toolbar-group">
      <button class="toolbar-btn" data-action="superscript" title="Superscript" data-i18n-title="toolbar.superscript">
        <span style="font-size:13px;font-weight:bold;vertical-align:super">x<sup>2</sup></span>
      </button>
      <button class="toolbar-btn" data-action="subscript" title="Subscript" data-i18n-title="toolbar.subscript">
        <span style="font-size:13px;font-weight:bold;vertical-align:sub">x<sub>2</sub></span>
      </button>
    </div>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar" id="tabBar"></div>

  <!-- Main Content Area -->
  <div class="body-content" id="bodyContent">
    <!-- Folder Sidebar -->
    <aside class="folder-sidebar" id="folderSidebar">
      <div class="folder-sidebar-header">
        <span class="folder-sidebar-title" data-i18n="folder.explorer">Outline</span>
        <div class="folder-sidebar-actions">
          <button class="folder-btn" id="folderOpenBtn" title="Open Folder">📂</button>
          <button class="folder-btn" id="folderCollapseAllBtn" title="Collapse All">⊟</button>
        </div>
      </div>
      <div class="folder-tree" id="folderTree">
        <div class="folder-placeholder" id="folderPlaceholder">
          <p data-i18n="folder.webPlaceholder">文件夹树仅在桌面版中可用</p>
          <a href="https://github.com/cloudzhang0/EasyMarkdown/releases" target="_blank" data-i18n="desktopPrompt.link">下载桌面版</a>
        </div>
      </div>
    </aside>

    <!-- Sidebar Resizer -->
    <div class="sidebar-resizer" id="sidebarResizer"></div>

    <main class="main-content" id="mainContent">
      <div class="editor-panel" id="editorPanel">
        <textarea id="editorTextarea"></textarea>
      </div>
      <div class="panel-resizer" id="panelResizer">
        <div class="resizer-handle"></div>
      </div>
      <div class="preview-panel" id="previewPanel">
        <div class="preview-content markdown-body" id="previewContent"></div>
      </div>
    </main>
  </div>

  <!-- Status Bar -->
  <footer class="status-bar" id="statusBar">
    <div class="status-left">
      <span class="status-item" id="statusFileName" data-i18n="status.untitled">Untitled</span>
      <span class="status-separator">|</span>
      <span class="status-item" id="statusSaveState" data-i18n="status.saved">Saved</span>
    </div>
    <div class="status-center" id="desktopPromptStatus">
      <span class="status-item">💡 <span data-i18n="desktopPrompt.text">提示：这是网页版，文件保存在浏览器中。需要保存到本地电脑？</span>
      <a href="https://github.com/cloudzhang0/EasyMarkdown/releases" target="_blank" class="status-link" data-i18n="desktopPrompt.link">下载桌面版</a></span>
    </div>
    <div class="status-right">
      <span class="status-item" id="statusWordCount"></span>
      <span class="status-separator">|</span>
      <span class="status-item" id="statusCharCount"></span>
      <span class="status-separator">|</span>
      <span class="status-item" id="statusLineCol">Ln 1, Col 1</span>
    </div>
  </footer>

  <!-- Hidden file input -->
  <input type="file" id="fileInput" accept=".md,.markdown,.txt" style="display:none">

  <!-- Dialog Overlay -->
  <div class="dialog-overlay" id="dialogOverlay" style="display:none">
    <div class="dialog" id="dialogBox">
      <div class="dialog-header">
        <h3 class="dialog-title" id="dialogTitle"></h3>
        <button class="dialog-close" id="dialogClose">&times;</button>
      </div>
      <div class="dialog-body" id="dialogBody"></div>
      <div class="dialog-footer" id="dialogFooter"></div>
    </div>
  </div>

  <!-- Help Modal -->
  <div class="help-overlay" id="helpOverlay" style="display:none">
    <div class="help-modal">
      <div class="help-header">
        <div class="help-tabs" id="helpTabs"></div>
        <button class="help-close" id="helpClose">&times;</button>
      </div>
      <div class="help-body" id="helpBody"></div>
    </div>
  </div>

  <!-- Local Scripts -->
  <script src="lib/codemirror/codemirror.min.js"></script>
  <script src="lib/codemirror/addon/mode/overlay.min.js"></script>
  <script src="lib/codemirror/mode/markdown/markdown.min.js"></script>
  <script src="lib/codemirror/mode/gfm/gfm.min.js"></script>
  <script src="lib/codemirror/mode/xml/xml.min.js"></script>
  <script src="lib/codemirror/mode/javascript/javascript.min.js"></script>
  <script src="lib/codemirror/mode/css/css.min.js"></script>
  <script src="lib/codemirror/mode/python/python.min.js"></script>
  <script src="lib/codemirror/mode/clike/clike.min.js"></script>
  <script src="lib/codemirror/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="lib/codemirror/addon/edit/continuelist.min.js"></script>
  <script src="lib/codemirror/addon/edit/closebrackets.min.js"></script>
  <script src="lib/codemirror/addon/edit/matchbrackets.min.js"></script>
  <script src="lib/codemirror/addon/display/placeholder.min.js"></script>
  <script src="lib/codemirror/addon/search/search.min.js"></script>
  <script src="lib/codemirror/addon/search/searchcursor.min.js"></script>
  <script src="lib/codemirror/addon/search/jump-to-line.min.js"></script>
  <script src="lib/codemirror/addon/dialog/dialog.min.js"></script>
  <script src="lib/marked/marked.min.js"></script>
  <script src="lib/highlightjs/highlight.min.js"></script>
  <script src="lib/dompurify/purify.min.js"></script>
  <script src="lib/mermaid/mermaid.min.js"></script>
  <script src="lib/katex/katex.min.js"></script>
  <script src="lib/katex/auto-render.min.js"></script>

  <!-- App Scripts -->
  <script src="js/i18n.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/splitter.js"></script>
  <script src="js/toolbar.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/file-manager.js"></script>
  <script src="js/statusbar.js"></script>
  <script src="js/tab-manager.js"></script>
  <script src="js/folder-tree.js"></script>
  <script src="js/shortcuts.js"></script>
  <script src="js/help.js"></script>
  <script src="js/desktop-bridge.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
